# End-to-end stack for Playwright.
#
# A self-contained variant of docker-compose.yml that (1) adds a DB healthcheck,
# (2) runs migrations + seed before the API starts, (3) gives the API a
# healthcheck, and (4) publishes non-conflicting host ports so it can run
# alongside other local stacks and in CI. The DB is ephemeral (no named volume).
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   docker compose -f docker-compose.e2e.yml down -v
#
# Frontend -> http://localhost:5174 , API -> http://localhost:3001
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d restaurantdb"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Apply migrations and a deterministic seed, then start the API.
    command: sh -c "npm run migrate:up && npm run seed && node server.js"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/restaurantdb
      PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/menu_items >/dev/null 2>&1 || exit 1"]
      interval: 4s
      timeout: 4s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Vite dev server reads VITE_BACKEND_URL at runtime, so the API URL is
    # configurable without rebuilding (a production build would inline it).
    command: npm run dev
    environment:
      VITE_BACKEND_URL: http://localhost:3001
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
